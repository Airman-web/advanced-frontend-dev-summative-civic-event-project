<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to CivicEvents to discover and register for city events.">
  <title>Sign in · CivicEvents</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1" data-hero="assets/img/city/login.jpg">
    <div class="w-full max-w-md">
      <h1 class="text-3xl font-bold tracking-tight">Welcome back</h1>
      <p class="mt-2 text-slate-600">Sign in to see what’s happening in your city.</p>

      <form id="login-form" class="mt-8 space-y-5" novalidate>
        <div class="field">
          <label for="email" class="label">Email address</label>
          <input id="email" name="email" type="email" class="input" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password" class="label">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" class="input pr-20" autocomplete="current-password" required>
            <button type="button" class="btn btn-ghost btn-sm absolute inset-y-1 right-1" data-toggle-password="password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="flex items-start gap-3">
          <input id="remember" name="remember" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-slate-400 text-brand-600 focus:ring-brand-500" aria-describedby="remember-hint">
          <div>
            <label for="remember" class="text-sm font-medium">Keep me signed in</label>
            <p id="remember-hint" class="text-xs text-slate-500">Only on a personal device. Your session is stored in this browser until it expires.</p>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Sign in</button>
      </form>

      <p class="mt-8 text-center text-sm text-slate-600">New to CivicEvents? <a href="signup.html" class="font-semibold text-brand-700 hover:underline">Create an account</a></p>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
