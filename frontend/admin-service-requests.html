<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review and resolve resident service requests.">
  <title>Service requests · CivicEvents Admin</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1">
    <div class="mb-6">
      <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Service requests</h1>
      <p class="mt-1 text-slate-600">Review issues reported by residents. Each status update notifies the resident.</p>
    </div>

    <div id="summary" class="mb-6 grid grid-cols-2 gap-3 md:grid-cols-4" role="group" aria-label="Filter by status"></div>

    <div class="card overflow-hidden">
      <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 p-4">
        <p class="text-sm font-medium text-slate-600" id="count" aria-live="polite"></p>
        <div class="flex flex-wrap gap-2">
          <label for="search" class="sr-only">Search requests</label>
          <input id="search" type="search" class="input w-56 py-1.5 text-sm" placeholder="Search title, resident or place">
          <label for="type" class="sr-only">Filter by type</label>
          <select id="type" class="input w-auto py-1.5 text-sm"><option value="">All types</option></select>
          <label for="status" class="sr-only">Filter by status</label>
          <select id="status" class="input w-auto py-1.5 text-sm">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="resolved">Resolved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <caption class="sr-only">Service requests from residents</caption>
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
            <tr>
              <th scope="col" class="px-4 py-3">Request</th>
              <th scope="col" class="hidden px-4 py-3 md:table-cell">Resident</th>
              <th scope="col" class="px-4 py-3">Status</th>
              <th scope="col" class="hidden px-4 py-3 sm:table-cell">Submitted</th>
              <th scope="col" class="px-4 py-3"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="rows" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
    <div id="pager" class="mt-6"></div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/admin-service-requests.js"></script>
</body>
</html>
