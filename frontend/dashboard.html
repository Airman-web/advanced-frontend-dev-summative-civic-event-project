<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your CivicEvents home.">
  <title>Home · CivicEvents</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1">
    <section class="relative flex min-h-[16rem] flex-col justify-center overflow-hidden rounded-3xl bg-brand-800 p-8 text-white shadow-lg sm:min-h-[20rem] sm:p-12" aria-labelledby="greeting">
      <img src="assets/img/city/home.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" aria-hidden="true">
      <div class="absolute inset-0 bg-gradient-to-r from-brand-950/95 via-brand-900/75 to-brand-900/30" aria-hidden="true"></div>
      <p class="relative text-sm font-medium text-brand-100" id="today"></p>
      <h1 id="greeting" class="relative mt-1 text-3xl font-bold tracking-tight sm:text-4xl">Welcome</h1>
      <p class="relative mt-2 max-w-xl text-brand-100">Here’s what’s happening in your city.</p>
      <div class="relative mt-6 flex flex-wrap gap-3">
        <a href="events.html" class="btn bg-white text-brand-700 hover:bg-brand-50">Browse events</a>
        <a href="my-registrations.html" class="btn border-white/30 bg-white/10 text-white hover:bg-white/20">My registrations</a>
      </div>
    </section>

    <section aria-labelledby="stats-heading" class="mt-8">
      <h2 id="stats-heading" class="sr-only">Your activity</h2>
      <div id="stats" class="grid grid-cols-2 gap-4 lg:grid-cols-4"></div>
    </section>

    <div class="mt-10 grid gap-10 lg:grid-cols-3">
      <section class="lg:col-span-2" aria-labelledby="upcoming-heading">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="upcoming-heading" class="text-xl font-semibold">Upcoming events</h2>
          <a href="events.html" class="text-sm font-semibold text-brand-700 hover:underline">See all</a>
        </div>
        <div id="upcoming" class="grid gap-6 sm:grid-cols-2"></div>
      </section>
      <section aria-labelledby="mine-heading">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="mine-heading" class="text-xl font-semibold">Your next events</h2>
          <a href="my-registrations.html" class="text-sm font-semibold text-brand-700 hover:underline">Manage</a>
        </div>
        <div id="my-events" class="card divide-y divide-slate-100"></div>
      </section>
    </div>

    <div class="mt-10 grid gap-10 lg:grid-cols-2">
      <section aria-labelledby="ann-heading">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="ann-heading" class="text-xl font-semibold">Latest announcements</h2>
          <a href="announcements.html" class="text-sm font-semibold text-brand-700 hover:underline">See all</a>
        </div>
        <div id="announcements" class="grid gap-3"></div>
      </section>
      <section aria-labelledby="promo-heading">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="promo-heading" class="text-xl font-semibold">Featured promos</h2>
          <a href="promos.html" class="text-sm font-semibold text-brand-700 hover:underline">See all</a>
        </div>
        <div id="promos" class="grid gap-6 sm:grid-cols-2"></div>
      </section>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
