<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a CivicEvents account.">
  <title>Create account · CivicEvents</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1">
    <div class="w-full max-w-md">
      <h1 class="text-3xl font-bold tracking-tight">Create your account</h1>
      <p class="mt-2 text-slate-600">Join to register for events and get city updates.</p>

      <form id="signup-form" class="mt-8 space-y-5" novalidate>
        <div class="field">
          <label for="full_name" class="label">Full name</label>
          <input id="full_name" name="full_name" type="text" class="input" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email" class="label">Email address</label>
          <input id="email" name="email" type="email" class="input" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password" class="label">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" class="input pr-20" autocomplete="new-password" aria-describedby="password-meter" required>
            <button type="button" class="btn btn-ghost btn-sm absolute inset-y-1 right-1" data-toggle-password="password" aria-pressed="false">Show</button>
          </div>
          <div id="password-meter" class="mt-3"></div>
        </div>
        <div class="field">
          <label for="confirm_password" class="label">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" class="input" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3">Create account</button>
      </form>

      <p class="mt-8 text-center text-sm text-slate-600">Already have an account? <a href="login.html" class="font-semibold text-brand-700 hover:underline">Sign in</a></p>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
