<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Events you have registered for.">
  <title>My registrations · CivicEvents</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1">
    <div class="mx-auto max-w-4xl">
      <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">My registrations</h1>
        <p class="mt-1 text-slate-600">Events you’ve signed up for.</p>
      </div>
      <div class="mb-4 flex gap-1 border-b border-slate-200" role="tablist" aria-label="Registration status">
        <button type="button" role="tab" id="tab-upcoming" aria-controls="registrations" data-tab="upcoming" class="-mb-px border-b-2 px-4 py-2.5 text-sm font-semibold">Upcoming</button>
        <button type="button" role="tab" id="tab-past" aria-controls="registrations" data-tab="past" class="-mb-px border-b-2 px-4 py-2.5 text-sm font-semibold">Past</button>
        <button type="button" role="tab" id="tab-cancelled" aria-controls="registrations" data-tab="cancelled" class="-mb-px border-b-2 px-4 py-2.5 text-sm font-semibold">Cancelled</button>
      </div>
      <div id="registrations" role="tabpanel" class="grid gap-3" tabindex="0"></div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/my-registrations.js"></script>
</body>
</html>
