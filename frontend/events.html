<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and register for city events.">
  <title>Events · CivicEvents</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
</head>
<body class="ce-booting min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  <main id="main" tabindex="-1">
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Events</h1>
        <p class="mt-1 text-slate-600">Discover what’s happening around the city and save your spot.</p>
      </div>
      <a href="admin-event-form.html" class="btn btn-primary hidden" data-admin-only>+ New event</a>
    </div>

    <form id="filters" class="card mb-6 grid gap-4 p-4 sm:grid-cols-2 lg:grid-cols-[2fr_1.2fr_1fr_1fr_1fr_auto] lg:items-end" role="search" aria-label="Filter events">
      <div>
        <label for="q" class="label">Search</label>
        <input id="q" name="q" type="search" class="input" placeholder="Title, description or place">
      </div>
      <div>
        <label for="location" class="label">Location</label>
        <select id="location" name="location" class="input"><option value="">All locations</option></select>
      </div>
      <div>
        <label for="from" class="label">From</label>
        <input id="from" name="from" type="date" class="input">
      </div>
      <div>
        <label for="to" class="label">To</label>
        <input id="to" name="to" type="date" class="input">
      </div>
      <div>
        <label for="when" class="label">Show</label>
        <select id="when" name="when" class="input">
          <option value="upcoming">Upcoming</option>
          <option value="past">Past</option>
          <option value="all">All events</option>
        </select>
      </div>
      <button type="reset" class="btn btn-ghost">Clear</button>
    </form>

    <p id="result-count" class="mb-4 text-sm font-medium text-slate-600" aria-live="polite"></p>
    <div id="event-list" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="event-pager" class="mt-8"></div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/events.js"></script>
</body>
</html>
